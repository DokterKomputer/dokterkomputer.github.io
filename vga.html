<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog VGA Card - Dokter Komputer</title>
  <!-- PapaParse untuk membaca CSV dari Google Sheets dengan mudah -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; }
    .price { color: #38bdf8; font-size: 1.4rem; font-weight: bold; margin: 10px 0; }
    .btn-build { display: inline-block; background: #0284c7; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Katalog VGA Card (Live Price)</h1>
    <p>Harga ter-update otomatis dari database pusat.</p>
    
    <div id="vga-container" class="grid">
      <p>Loading data VGA...</p>
    </div>
  </div>

  <script>
    // URL CSV dari 'Publish to Web' Google Sheets Kamu
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtlCPlmhdSqERuaycDLRrPj-SXwUKAbDZCRgX5xmErLdhOdeToHI_quK8Ep3Rxy8ZqUt9eTbI9VX9Z/pub?gid=0&single=true&output=csv';

    function loadVGAData() {
      Papa.parse(GOOGLE_SHEET_CSV_URL, {
        download: true,
        header: true,
        complete: function(results) {
          const data = results.data;
          const container = document.getElementById('vga-container');
          container.innerHTML = ''; // bersihkan loading

          data.forEach(item => {
            if(item.ID && item.Nama_Parts) {
              const formattedPrice = Number(item.Harga).toLocaleString('id-ID');
              
              const cardHTML = `
                <div class="card">
                  <h3>${item.Nama_Parts}</h3>
                  <div class="price">Rp ${formattedPrice}</div>
                  <a href="simulasi-build.html?select_vga=${item.ID}" class="btn-build">Rakit dengan VGA Ini</a>
                </div>
              `;
              container.innerHTML += cardHTML;
            }
          });
        }
      });
    }

    // Jalankan fungsi saat halaman dibuka
    loadVGAData();
  </script>
</body>
</html>
