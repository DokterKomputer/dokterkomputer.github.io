<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Tracker - Dokter Komputer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center top, #071f2e 0%, #030a10 70%, #010407 100%);
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .admin-container {
      max-width: 950px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #102636;
      padding-bottom: 15px;
    }
    .header h1 { color: #dfb15b; font-size: 1.8rem; }
    
    .card {
      background: rgba(8, 18, 27, 0.85);
      border: 1px solid #102636;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      backdrop-filter: blur(5px);
    }
    .card h2 {
      font-size: 1.2rem;
      color: #dfb15b;
      margin-bottom: 15px;
      border-bottom: 1px dashed #1c3e56;
      padding-bottom: 8px;
    }
    
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #7b93a4;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #102636;
      background: #030a10;
      color: #fff;
      font-size: 0.95rem;
    }
    .form-control:focus { outline: none; border-color: #dfb15b; }
    
    .btn {
      background: #dfb15b;
      color: #030a10;
      font-weight: bold;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #d9232d; color: #fff; }
    
    .btn-action {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      margin-right: 4px;
      margin-bottom: 4px;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }
    .btn-wa { background: #25d366; color: #fff; }
    .btn-wa:hover { background: #1ebd56; }
    .btn-delete { background: #e74c3c; color: #fff; }
    .btn-delete:hover { background: #c0392b; }
    .btn-status { background: #3498db; color: #fff; }
    .btn-status:hover { background: #2980b9; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #102636;
      font-size: 0.85rem;
    }
    th { color: #dfb15b; background: rgba(3, 10, 16, 0.5); }
    
    .badge-code {
      background: #102636;
      color: #00e5ff;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    /* Login Modal */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #030a10;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .login-box {
      background: rgba(8, 18, 27, 0.95);
      border: 1px solid #dfb15b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 350px;
      width: 90%;
    }
  </style>
</head>
<body>

  <!-- MODAL LOGIN PIN ADMIN -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2 style="color: #dfb15b; margin-bottom: 15px;">Akses Admin</h2>
      <input type="password" id="pinInput" class="form-control" placeholder="Masukkan PIN Admin" style="text-align: center; margin-bottom: 15px;">
      <button class="btn" style="width: 100%;" onclick="loginAdmin()">Masuk Dashboard</button>
    </div>
  </div>

  <div class="admin-container">
    <!-- 1. HEADER DENGAN TOMBOL KEMBALI -->
    <div class="header">
      <div>
        <h1>🛠️ Dashboard Admin Tracker</h1>
        <p style="color: #7b93a4; font-size: 0.9rem;">Dokter Komputer - Progress Perakitan PC</p>
      </div>
      <a href="index.html" class="btn" style="background: #102636; color: #00e5ff; border: 1px solid #00e5ff;">🏠 Utama</a>
    </div>

    <!-- FORM INPUT ORDER BARU -->
    <div class="card">
      <h2>+ Tambah Pesanan Baru</h2>
      <form id="addOrderForm" onsubmit="createNewOrder(event)">
        <div class="form-group">
          <label>Nama Customer</label>
          <input type="text" id="custName" class="form-control" placeholder="Contoh: Budi Santoso" required>
        </div>
        <div class="form-group">
          <label>No. WhatsApp (Format: 08xx / 628xx)</label>
          <input type="text" id="custWA" class="form-control" placeholder="Contoh: 08123456789">
        </div>
        <div class="form-group">
          <label>Catatan Awal / Spesifikasi Part</label>
          <input type="text" id="custNote" class="form-control" placeholder="Contoh: RTX 4060, i5 13400F, RAM 32GB">
        </div>
        <button type="submit" class="btn" id="btnSubmit">Generate Kode & Simpan</button>
      </form>
    </div>

    <!-- TABEL LIST PESANAN -->
    <div class="card">
      <h2>Daftar Progress Perakitan</h2>
      
      <!-- 3 & 4. SEARCH BAR & FILTER ORDERAN SELESAI -->
      <div class="filter-bar">
        <input type="text" id="searchInput" class="form-control" style="max-width: 300px;" placeholder="🔍 Cari Kode Resi / Nama..." onkeyup="filterData()">
        
        <label style="font-size: 0.85rem; color: #7b93a4; cursor: pointer;">
          <input type="checkbox" id="hideCompleted" onchange="filterData()"> Sembunyikan Pesanan Selesai
        </label>
        
        <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="loadData()">🔄 Refresh</button>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Kode</th>
              <th>Nama</th>
              <th>Status Progress</th>
              <th>Catatan / Part List</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #7b93a4;">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzOA4WmZ8X3-5gs6SCy5hsdvr2dsoE9Tke4yFU_eNRMxM2xYNrgjqQJiuclLtmnBCAH/exec";
    let CURRENT_PIN = "";
    let rawDataCache = [];

    function loginAdmin() {
      const pin = document.getElementById('pinInput').value;
      if (!pin) return alert("Masukkan PIN!");
      CURRENT_PIN = pin;
      loadData();
    }

    function loadData() {
      fetch(`${API_URL}?action=getAll&pin=${CURRENT_PIN}`)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            document.getElementById('loginOverlay').style.display = 'none';
            rawDataCache = res.data;
            filterData();
          } else {
            alert(res.message);
          }
        })
        .catch(err => alert("Gagal mengambil data: " + err));
    }

    // Filter berdasarkan Search (Kode/Nama) dan Checkbox Selesai
    function filterData() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const hideFinished = document.getElementById('hideCompleted').checked;

      const filtered = rawDataCache.filter(item => {
        const matchesSearch = item.kode.toLowerCase().includes(searchVal) || item.nama.toLowerCase().includes(searchVal);
        const isFinished = ['Selesai', 'Self-Pickup', 'Delivery'].includes(item.progress);
        
        if (hideFinished && isFinished) return false;
        return matchesSearch;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('orderTableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Tidak ada pesanan ditemukan.</td></tr>';
        return;
      }

      const progressOptions = [
        "Pesanan Diterima",
        "Collecting Item",
        "Proses Perakitan",
        "Proses Instalasi",
        "Proses QC",
        "Pesanan Dikirim",
        "Self-Pickup",
        "Selesai"
      ];

      data.forEach(item => {
        let optionsHtml = progressOptions.map(opt => 
          `<option value="${opt}" ${item.progress === opt ? 'selected' : ''}>${opt}</option>`
        ).join('');

        let cleanWA = item.noWA ? item.noWA.toString().replace(/[^0-9]/g, '') : '';
        if (cleanWA.startsWith('0')) cleanWA = '62' + cleanWA.slice(1);

        let waText = encodeURIComponent(`Halo Kak ${item.nama}, status perakitan PC kamu [Kode: *${item.kode}*] saat ini: *${item.progress}*.\n\nCek detail: https://dokterkomputer.github.io/track-build.html?code=${item.kode}`);
        let waLink = cleanWA ? `https://wa.me/${cleanWA}?text=${waText}` : '#';

        tbody.innerHTML += `
          <tr>
            <td><span class="badge-code">${item.kode}</span></td>
            <td><strong>${item.nama}</strong></td>
            <td>
              <select class="form-control" onchange="updateProgress(${item.row}, this.value, '${item.catatan || ''}')">
                ${optionsHtml}
              </select>
            </td>
            <td>
              <input type="text" class="form-control" value="${item.catatan || ''}" onblur="updateNote(${item.row}, '${item.progress}', this.value)">
            </td>
            <td>
              <!-- 2 & 5. OPSI AKSI LENGKAP -->
              <button class="btn-action btn-status" onclick="updateProgress(${item.row}, 'Pesanan Diterima', '${item.catatan || ''}')">📥 Diterima</button>
              <button class="btn-action btn-status" style="background:#f39c12;" onclick="updateProgress(${item.row}, 'Pesanan Dikirim', '${item.catatan || ''}')">🚚 Dikirim</button>
              ${cleanWA ? `<a href="${waLink}" target="_blank" class="btn-action btn-wa" style="text-decoration:none;">💬 WA</a>` : ''}
              <button class="btn-action btn-delete" onclick="deleteOrder(${item.row}, '${item.kode}')">🗑️ Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    function createNewOrder(e) {
      e.preventDefault();
      const nama = document.getElementById('custName').value;
      const noWA = document.getElementById('custWA').value;
      const catatan = document.getElementById('custNote').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'create',
          pin: CURRENT_PIN,
          nama: nama,
          noWA: noWA,
          catatan: catatan
        })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = "Generate Kode & Simpan";
        if (res.success) {
          alert(`Berhasil! Kode Tracking: ${res.code}`);
          document.getElementById('addOrderForm').reset();
          loadData();
        } else {
          alert(res.message);
        }
      });
    }

    function updateProgress(row, newProgress, currentNote) {
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'update',
          pin: CURRENT_PIN,
          row: row,
          progress: newProgress,
          catatan: currentNote
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) loadData();
        else alert(res.message);
      });
    }

    function updateNote(row, currentProgress, newNote) {
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'update',
          pin: CURRENT_PIN,
          row: row,
          progress: currentProgress,
          catatan: newNote
        })
      });
    }

    // FITUR HAPUS PESANAN
    function deleteOrder(row, kode) {
      if (!confirm(`Apakah Anda yakin ingin menghapus pesanan dengan Kode ${kode}?`)) return;

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'delete',
          pin: CURRENT_PIN,
          row: row
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert("Pesanan berhasil dihapus!");
          loadData();
        } else {
          alert(res.message);
        }
      });
    }
  </script>
</body>
</html>
